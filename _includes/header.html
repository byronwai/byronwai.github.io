<header class="site-header">
  <div class="wrap">
    {% if page.url == '/' %}
    <h1 class="site-title"><span class="seal-mark" aria-hidden="true">錯</span><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
    {% else %}
    <div class="site-title"><span class="seal-mark" aria-hidden="true">錯</span><a href="{{ '/' | relative_url }}">{{ site.title }}</a></div>
    {% endif %}
    <nav class="site-nav" aria-label="Main">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active"{% endif %}>Home</a>
      <a href="{{ '/archives/' | relative_url }}"{% if page.url == '/archives/' %} class="active"{% endif %}>Archives</a>
      <a href="{{ '/tags/' | relative_url }}"{% if page.url == '/tags/' %} class="active"{% endif %}>Tags</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} class="active"{% endif %}>About</a>
      <button id="theme-toggle" type="button" class="theme-toggle" aria-label="切換深淺色模式">☾</button>
    </nav>
  </div>
</header>
<script>
  (function () {
    var btn = document.getElementById('theme-toggle');
    if (!btn) return;
    var root = document.documentElement;
    var syncGlyph = function () {
      var dark = root.getAttribute('data-theme') === 'dark';
      btn.textContent = dark ? '☀' : '☾';
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', dark ? '#191715' : '#faf8f5');
    };
    syncGlyph();
    btn.addEventListener('click', function () {
      var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) {}
      syncGlyph();
    });
  })();
</script>
