<div class="read-progress" aria-hidden="true"><span></span></div>
<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} 首頁">
      <span class="brand-mark" aria-hidden="true">錯</span>
      <span class="brand-name">{{ site.title }}</span>
    </a>

    <nav class="site-nav" id="site-nav" aria-label="Main">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active" aria-current="page"{% endif %}>Home</a>
      <a href="{{ '/archives/' | relative_url }}"{% if page.url == '/archives/' %} class="active" aria-current="page"{% endif %}>Archives</a>
      <a href="{{ '/tags/' | relative_url }}"{% if page.url == '/tags/' %} class="active" aria-current="page"{% endif %}>Tags</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} class="active" aria-current="page"{% endif %}>About</a>
    </nav>

    <div class="header-actions">
      <button type="button" class="search-trigger" data-search-open aria-label="搜尋文章">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span class="search-trigger-label">搜尋</span>
        <kbd class="search-trigger-kbd">Ctrl K</kbd>
      </button>
      <button type="button" class="icon-btn" id="theme-toggle" aria-label="切換深淺色模式">
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      </button>
      <button type="button" class="icon-btn menu-toggle" aria-label="選單" aria-controls="site-nav" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>
</header>
