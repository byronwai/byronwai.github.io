<header class="site-header">
  <div class="wrap">
    {% if page.url == '/' %}
    <h1 class="site-title"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
    {% else %}
    <div class="site-title"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></div>
    {% endif %}
    <nav class="site-nav" aria-label="Main">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active"{% endif %}>Home</a>
      <a href="{{ '/archives/' | relative_url }}"{% if page.url == '/archives/' %} class="active"{% endif %}>Archives</a>
      <a href="{{ '/tags/' | relative_url }}"{% if page.url == '/tags/' %} class="active"{% endif %}>Tags</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} class="active"{% endif %}>About</a>
    </nav>
  </div>
</header>
