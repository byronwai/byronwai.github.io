<div class="search-modal" id="search-modal" role="dialog" aria-modal="true" aria-label="搜尋文章" hidden data-index="{{ '/search.json' | relative_url }}">
  <div class="search-backdrop" data-search-close></div>
  <div class="search-panel">
    <div class="search-input-row">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input type="search" id="search-input" placeholder="搜尋標題、標籤或內文…" autocomplete="off" spellcheck="false" aria-controls="search-results">
      <kbd data-search-close>Esc</kbd>
    </div>
    <ul class="search-results" id="search-results" role="listbox"></ul>
    <div class="search-foot">
      <span><kbd>↑</kbd><kbd>↓</kbd> 選擇</span>
      <span><kbd>Enter</kbd> 開啟</span>
      <span><kbd>/</kbd> 或 <kbd>Ctrl K</kbd> 開啟搜尋</span>
    </div>
  </div>
</div>
