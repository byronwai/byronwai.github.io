---
layout: default
---

<article class="page">
  {% if page.title and page.url != '/404.html' %}
  <header class="page-header">
    <h1 class="page-title">{{ page.title }}</h1>
    {% if page.description %}<p class="page-desc">{{ page.description }}</p>{% endif %}
  </header>
  {% endif %}
  <div class="page-content">
    {{ content }}
  </div>
</article>
