# Site configuration for 從零開始的編程生活
# Built with GitHub Pages' native Jekyll (3.9.x) — no custom plugins beyond jekyll-feed.

title: 錯題簿
description: Byron Wai 的部落格，記錄編程與日常生活。
author: Byron Wai
lang: zh-Hant

url: "https://byronwai.github.io"
baseurl: ""

timezone: UTC

markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/

plugins:
  - jekyll-feed

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: pages
    values:
      layout: page

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - migration_report.md
