# Site configuration for 從零開始的編程生活
# Built with GitHub Pages' native Jekyll (3.9.x) — no custom plugins beyond jekyll-feed.

title: 錯題簿
description: Byron Wai 的部落格，記錄編程與日常生活。
author: Byron Wai
lang: zh-Hant

url: "https://byronwai.github.io"
baseurl: ""

timezone: UTC

markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/

plugins:
  - jekyll-feed

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: pages
    values:
      layout: page

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - migration_report.md

# Google Analytics (GA4)
# Set id to "" to disable tracking.
google-analytics:
  id: "G-YKM8R2ZHTM"

# Giscus comments (GitHub Discussions) — https://giscus.app
# The widget renders on posts only when category_id is set. Prerequisites:
# 1) Discussions enabled on this repo (repo Settings → General → Features)
# 2) the giscus GitHub app installed (https://github.com/apps/giscus)
# 3) data-category-id from giscus.app (or the discussions categories API)
# Opt out per post with `comments: false` in a post's front matter.
giscus:
  repo: "byronwai/byronwai.github.io"
  repo_id: "R_kgDOU8AtJA"
  category: "Announcements"
  category_id: ""
  mapping: "pathname"
  lang: "zh-Hant"
