# Site configuration for 錯題簿
# Theme: Minimal Mistakes via jekyll-remote-theme (GitHub Pages compatible).

title: 錯題簿
description: Byron Wai 的部落格，記錄編程與日常生活。
author:
  name: GonJK
  bio: "Security, hardware, photography. Breaking things and writing it down."

locale: en-US
url: "https://byronwai.github.io"
baseurl: ""

timezone: UTC

markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/

remote_theme: mmistakes/minimal-mistakes
minimal_mistakes_skin: dirt

search: true

paginate: 10
paginate_path: /page:num/

plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-paginate

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: false
      share: false
      related: false
      show_date: true
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - migration_report.md
